
name: Compiler CleanYourTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: Recuperer le code CleanYourTV
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compiler APK
        working-directory: launcher
        run: bash gradlew assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-2.4.0-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
